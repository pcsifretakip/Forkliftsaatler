<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#031a4a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Forklift">
<title>Forklift</title>
<style>
:root{
 --navy:#031a4a;--navy2:#0a3fa0;--blue:#0a49b8;
 --yellow:#ffd100;--yellow2:#ffe56b;--ink:#0a2a6b;--text:#fff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:radial-gradient(120% 80% at 50% 0%,#0d46b0 0%,#042060 55%,#010d2a 100%);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;padding:0}
.app{height:100dvh;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));max-width:620px;margin:0 auto;position:relative}
.app::before{content:"";position:fixed;left:0;right:0;top:0;height:5px;background:var(--yellow);box-shadow:0 2px 12px #ffd10080;z-index:5}
header{display:flex;align-items:center;justify-content:center;position:relative;height:46px;flex:0 0 46px;margin-bottom:10px}
header h1{margin:0;white-space:nowrap;font-size:clamp(16px,6vw,30px);font-weight:900;font-style:italic;letter-spacing:.5px;color:var(--yellow);text-shadow:0 2px 0 #021a4a}
header.long{padding:0 54px}
header.long h1{font-size:clamp(12px,4.3vw,22px)}
.view{flex:1;min-height:0;display:flex;flex-direction:column}

/* ===== 3D ayna butonlar ===== */
.b3d{position:relative;overflow:hidden;border:0;border-radius:16px;font-weight:900;color:#fff;
 background:linear-gradient(180deg,#3a78ea 0%,#0a49b8 52%,#062f80 100%);
 box-shadow:0 6px 0 #021a4a,0 11px 14px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.55);
 text-shadow:0 2px 2px rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s}
.b3d::before{content:"";position:absolute;left:0;right:0;top:0;height:48%;pointer-events:none;
 background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.08));border-radius:16px 16px 50% 50%/16px 16px 12px 12px}
.b3d>*{position:relative;z-index:1}
.b3d:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 #021a4a,0 3px 6px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.4)}
.b3d.y{color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.5);
 background:linear-gradient(180deg,#fff08a 0%,#ffd100 52%,#e2a900 100%);
 box-shadow:0 6px 0 #8a6500,0 11px 14px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.9)}
.b3d.y:active:not(:disabled){box-shadow:0 1px 0 #8a6500,0 3px 6px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.7)}
.b3d:disabled{filter:grayscale(.7) brightness(.7);cursor:default}
.b3d:disabled::after{display:none}
.b3d.g{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45);
 background:linear-gradient(180deg,#8cf0a4 0%,#1fc15a 52%,#12893c 100%);
 box-shadow:0 6px 0 #0a5a26,0 11px 14px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.8)}
.b3d.g:active:not(:disabled){box-shadow:0 1px 0 #0a5a26,0 3px 6px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.6)}
.b3d.g.sel{outline:3px solid #fff;outline-offset:1px}
.day u{text-decoration:none;white-space:nowrap;font-size:8px;font-weight:800;line-height:1.1;margin-top:1px}
.back{position:absolute;right:0;top:3px;width:44px;height:40px;font-size:18px;border-radius:13px}
#closeBtn,#closeBtn2{background:linear-gradient(180deg,#ff6b6b 0%,#e01b2f 52%,#9c0b1c 100%);box-shadow:0 6px 0 #5c0510,0 11px 14px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.55)}
#closeBtn:active:not(:disabled),#closeBtn2:active:not(:disabled){box-shadow:0 1px 0 #5c0510,0 3px 6px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.4)}

/* ===== Ana sayfa ===== */
.split{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:14px}
#vHome .split{margin:6px 2px 14px;padding:14px 14px 8px;border-radius:22px;background:linear-gradient(180deg,#0b3a96,#072468);border:1px solid rgba(255,255,255,.18);box-shadow:0 6px 0 #021a4a,0 12px 18px rgba(0,0,0,.5)}
.col{display:flex;flex-direction:column;gap:12px;min-height:0;padding-bottom:7px}
.col .b3d>span{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.col .b3d svg{width:clamp(34px,11vw,52px);height:auto;fill:currentColor;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.col .b3d.g{background:linear-gradient(180deg,#8cf0a4 0%,#1fc15a 52%,#12893c 100%);box-shadow:0 6px 0 #0a5a26,0 11px 14px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.8)}
.col .b3d{flex:1;min-height:0;font-size:clamp(16px,4.6vw,24px);letter-spacing:.3px}
.big{flex-direction:column;display:flex;align-items:center;justify-content:center;gap:14px;text-align:center;padding:10px;line-height:1.25}
.big svg{width:clamp(48px,18vw,92px);height:auto;filter:drop-shadow(0 3px 0 rgba(255,255,255,.55))}
.big span{font-size:clamp(17px,5vw,26px);font-weight:900}
#names .b3d span,.big span{text-transform:uppercase}

/* ===== Operatör ===== */
.topbar{display:flex;align-items:center;gap:10px;height:46px;flex:0 0 46px;margin-bottom:8px}
.topbar h2{margin:0;font-size:clamp(20px,6vw,26px);font-weight:900;flex:1;color:var(--yellow);text-shadow:0 2px 0 #021a4a}
.calcard{flex:0 0 auto;padding:12px 10px 14px;margin:0 2px 16px;border-radius:22px;background:linear-gradient(180deg,#0b3a96,#072468);border:1px solid rgba(255,255,255,.18);box-shadow:0 6px 0 #021a4a,0 12px 18px rgba(0,0,0,.5)}
.calcard .weekbar{margin-bottom:12px}
.weekbar{display:flex;align-items:center;gap:10px;flex:0 0 46px;margin-bottom:10px}
.weekbar .b3d{width:46px;height:40px;font-size:20px;border-radius:13px}
.weekbar .lbl{flex:1;text-align:center;font-weight:800;font-size:14px;line-height:1.2}
.weekbar .lbl small{display:block;font-weight:600;opacity:.75;font-size:12px}
.days{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;flex:0 0 auto;padding-bottom:7px}
.day{height:clamp(72px,12dvh,90px);display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:14px}
.day i{font-style:normal;font-size:12px;font-weight:800;opacity:.9}
.day b{font-size:clamp(18px,5.4vw,24px);line-height:1.1}
.day em{font-style:normal;font-size:11px;font-weight:800;min-height:14px}
.mid{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;margin:6px 0}
.hours{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr;gap:12px;flex:1;min-height:0;max-height:260px;padding-bottom:7px}
.hours .b3d{font-size:clamp(24px,8vw,38px);border-radius:18px}
.ask{position:relative;text-align:center;font-weight:900;font-size:clamp(17px,5.2vw,23px);letter-spacing:.4px;line-height:1.2;text-wrap:balance;color:#fff;
 padding:16px 12px;margin:2px 2px 16px;flex:0 0 auto;border-radius:18px;
 background:linear-gradient(180deg,#3a78ea 0%,#0a49b8 55%,#062f80 100%);
 border:1px solid rgba(255,255,255,.25);
 text-shadow:0 2px 2px rgba(0,0,0,.45);
 box-shadow:0 6px 0 #021a4a,0 12px 18px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.55);overflow:hidden}
.ask::before{content:"";position:absolute;left:0;right:0;top:0;height:48%;background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,.04));border-radius:18px 18px 40% 40%/18px 18px 14px 14px}
.ask span{position:relative;color:var(--yellow)}
.askcard{flex:0 1 auto;min-height:0;display:flex;flex-direction:column;padding:16px 10px 14px;margin:2px 2px 16px;border-radius:22px;background:linear-gradient(180deg,#0b3a96,#072468);border:1px solid rgba(255,255,255,.18);box-shadow:0 6px 0 #021a4a,0 12px 18px rgba(0,0,0,.5)}
.asktxt{text-align:center;font-weight:900;font-size:clamp(17px,5.2vw,23px);letter-spacing:.4px;line-height:1.2;text-wrap:balance;color:var(--yellow);text-shadow:0 2px 2px rgba(0,0,0,.45);padding:0 4px 16px}
.askcard .hours{flex:0 1 auto;height:clamp(150px,27dvh,240px);max-height:none}
.state{text-align:center;font-size:clamp(18px,5.4vw,24px);font-weight:900;color:var(--yellow);text-shadow:0 2px 0 #021a4a}
.entries{display:none!important;flex:0 0 40px;display:flex;gap:8px;overflow-x:auto;align-items:center;margin-bottom:8px;scrollbar-width:none}
.entries::-webkit-scrollbar{display:none}
.entry{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:5px 6px 5px 12px;border-radius:30px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);font-weight:800;font-size:14px}
.entry.edit{background:var(--yellow);color:var(--ink);border-color:#fff}
.elabel{background:none;border:0;font-weight:800;font-size:14px;padding:4px 2px;color:inherit}
.entry button.x{width:28px;height:28px;border-radius:50%;border:0;background:#c8102e;color:#fff;font-size:13px;box-shadow:0 2px 0 #6e0a1b}
.save{flex:0 0 clamp(54px,9dvh,64px);font-size:clamp(17px,5vw,22px);margin-bottom:7px}

/* ===== Saatler ===== */
.sathead{display:flex;align-items:stretch;gap:12px;flex:0 0 auto;margin-bottom:12px}
#closeBtn2{flex:0 0 56px;width:56px;font-size:20px;border-radius:16px;margin-bottom:6px}
.sat{flex:1;min-width:0;border-radius:18px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;
 background:linear-gradient(180deg,#fff08a,#ffd100 55%,#e2a900);color:var(--ink);
 box-shadow:0 6px 0 #8a6500,0 11px 14px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.9)}
.sat small{font-weight:800;font-size:13px;opacity:.8;display:block}
.sat b{font-size:clamp(22px,7vw,30px);font-weight:900;line-height:1.15;display:block}
.sat small.lbl2{margin-top:2px}
.sat svg{width:54px;height:54px;flex:0 0 54px}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;flex:0 0 auto;padding:4px;margin-bottom:12px;border-radius:999px;background:rgba(1,10,34,.55);box-shadow:inset 0 2px 5px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.12)}
.seg::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:linear-gradient(180deg,#fff08a,#ffd100 55%,#e2a900);box-shadow:0 2px 6px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.8);transition:transform .22s cubic-bezier(.3,.8,.3,1)}
.seg[data-tab="total"]::before{transform:translateX(100%)}
.seg button{position:relative;z-index:1;height:42px;border:0;border-radius:999px;background:transparent;color:#fff;font:inherit;font-weight:900;font-size:15px;transition:color .2s}
.seg button.on{color:var(--ink)}
.seg .car{display:inline-block;margin-left:6px;font-size:12px;opacity:.7}
.wklist{max-height:min(62dvh,520px);overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:2px 2px 10px;-webkit-overflow-scrolling:touch}
.wkit{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:0;border-radius:14px;padding:12px 14px;background:rgba(1,10,34,.45);color:#fff;font:inherit;font-weight:900;font-size:17px;text-align:left}
.wkit small{font-weight:700;opacity:.75;font-size:13px;white-space:nowrap}
.wkit.cur{box-shadow:inset 0 0 0 2px #1fc15a}
.wkit.sel{background:linear-gradient(180deg,#fff08a,#ffd100 55%,#e2a900);color:var(--ink)}
.wkit.sel small{opacity:.8}
.statcard{flex:1;min-height:0;display:flex;flex-direction:column;margin:6px 2px 14px;padding:12px 14px 4px;border-radius:22px;background:linear-gradient(180deg,#0b3a96,#072468);border:1px solid rgba(255,255,255,.18);box-shadow:0 6px 0 #021a4a,0 12px 18px rgba(0,0,0,.5)}
.statcard .seg+.rows{border-top:1px solid rgba(255,255,255,.28)}
.rows{flex:1;min-height:0;display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:clamp(62px,19vw,86px) 1fr 52px;align-items:center;gap:10px}
.row{cursor:pointer;flex:1;min-height:0;border-radius:0;padding:4px 0;margin:0;border-bottom:1px solid rgba(255,255,255,.28)}
.row:last-child{border-bottom:0}
.row:active{background:rgba(255,255,255,.12)}
.row .nm{font-weight:900;font-size:clamp(14px,4vw,18px)}
.track{height:clamp(18px,3.6dvh,26px);border-radius:20px;background:rgba(0,0,0,.4);box-shadow:inset 0 3px 5px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.2);overflow:hidden}
.fill{position:relative;height:100%;border-radius:20px;min-width:0;transition:width .5s;
 background:linear-gradient(180deg,#8dbaff,#3a78ea 55%,#1b57c9);box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.fill::after{content:"";position:absolute;left:4px;right:4px;top:2px;height:40%;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.65),rgba(255,255,255,.05))}
.fill.y{background:linear-gradient(180deg,#fff08a,#ffd100 55%,#e2a900)}
.row .hr{text-align:right;font-weight:900;font-size:clamp(14px,4vw,18px);white-space:nowrap}
.row.low .hr{color:var(--yellow)}

.modal{position:fixed;inset:0;background:rgba(1,10,34,.78);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:20;padding:14px}
.cf{text-align:center;padding:22px 18px 16px}
.cf .ic{width:56px;height:56px;margin:0 auto 10px;border-radius:50%;background:#c8102e;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #6e0a1b,0 8px 16px rgba(0,0,0,.4)}
.cf .ic svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.cf h3{margin:0 0 6px;font-size:20px;font-weight:900;color:#fff}
.cf p{margin:0 0 18px;font-size:15px;font-weight:700;color:#cfe0ff}
.cf .btns{display:flex;gap:10px}
.cf .b3d{flex:1;height:50px;font-size:16px;border-radius:14px}
.b3d.r,.cf .b3d.r{background:linear-gradient(180deg,#ff6b81 0%,#c8102e 55%,#8a0a1f 100%);box-shadow:0 5px 0 #5a0715,0 9px 12px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.5)}
#cfModal{animation:cfIn .15s ease-out}
@keyframes cfIn{from{opacity:0}to{opacity:1}}
.sheet{width:min(100%,380px);padding:14px 14px 8px;border-radius:24px;background:linear-gradient(180deg,#0f4cbc,#052a78);border:2px solid rgba(255,255,255,.18);box-shadow:0 20px 50px rgba(0,0,0,.6)}
.dhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.dhead h3{margin:0;font-size:24px;font-weight:900;color:var(--yellow);text-shadow:0 2px 0 #021a4a}
.dx{width:44px;height:38px;font-size:16px;border-radius:12px;margin-bottom:6px;background:linear-gradient(180deg,#ff6b6b 0%,#e01b2f 52%,#9c0b1c 100%);box-shadow:0 6px 0 #5c0510,0 11px 14px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.55)}
.dx:active:not(:disabled){box-shadow:0 1px 0 #5c0510,0 3px 6px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.4)}
.dweek{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.dweek .b3d{width:44px;height:38px;font-size:18px;border-radius:12px;flex:0 0 44px;margin-bottom:6px}
.dweek #dLbl{flex:1;text-align:center;line-height:1.2}
.dweek #dLbl b{display:block;font-size:16px}
.dweek #dLbl small{font-size:12px;opacity:.8}
.drow{display:flex;justify-content:space-between;align-items:center;padding:0 12px;height:clamp(38px,6.4dvh,48px);border-radius:12px;font-weight:800;font-size:16px}
.drow{border-bottom:1px solid rgba(255,255,255,.28);border-radius:0}
.drow:last-child{border-bottom:0}
.drow small{font-size:12px;opacity:.7;font-weight:600;margin-left:6px}
.drow b{color:var(--yellow);font-size:18px}
.drow.zero b{color:rgba(255,255,255,.45)}
.dfoot{display:flex;justify-content:space-between;padding:12px 12px 8px;font-weight:700;font-size:14px;border-top:1px solid rgba(255,255,255,.2);margin-top:8px}
.dfoot b{color:var(--yellow);font-size:17px;margin-left:4px}
.toast{position:fixed;left:50%;top:50%;z-index:40;transform:translate(-50%,-50%) scale(.8);opacity:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:150px;max-width:calc(100vw - 48px);padding:20px 26px;border-radius:22px;text-align:center;color:#fff;font-weight:900;font-size:18px;text-shadow:0 2px 2px rgba(0,0,0,.35);
 background:linear-gradient(180deg,#2fcf68 0%,#15a047 100%);border:2px solid rgba(255,255,255,.35);box-shadow:0 7px 0 #0a5a26,0 18px 36px rgba(0,0,0,.55);transition:opacity .18s,transform .18s}
.toast svg{width:38px;height:38px;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.toast.err{background:linear-gradient(180deg,#ff6b81 0%,#c8102e 100%);box-shadow:0 7px 0 #6e0a1b,0 18px 36px rgba(0,0,0,.55)}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#tbg{position:fixed;inset:0;z-index:39;pointer-events:none;opacity:0;background:rgba(1,10,34,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:opacity .15s}
#tbg.show{opacity:1}
@media(prefers-reduced-motion:reduce){.b3d::after{animation:none;display:none}.fill,.toast{transition:none}}
@media(max-height:560px){.day{height:58px}.hours{max-height:170px;gap:8px}header,.topbar{height:40px;flex-basis:40px}}
</style>
</head>
<body>
<div class="app">
<header>
 <h1 id="ttl">FORKLIFT ÇALIŞMA SAATİ</h1>
 <button class="b3d back" id="closeBtn" hidden aria-label="Kapat"><span>✕</span></button>
</header>

<!-- ANA SAYFA -->
<section class="view" id="vHome">
 <div class="split">
  <div class="col" id="names"></div>
  <div class="col">
   <button class="b3d y big" id="goStats">
    <svg viewBox="0 0 64 64" fill="none" aria-hidden="true"><rect x="8" y="34" width="12" height="22" rx="3" fill="#0a2a6b"/><rect x="26" y="20" width="12" height="36" rx="3" fill="#0a2a6b"/><rect x="44" y="8" width="12" height="48" rx="3" fill="#0a2a6b"/></svg>
    <span>Çalışma saatlerini gör</span>
   </button>
  </div>
 </div>
</section>

<!-- OPERATÖR -->
<section class="view" id="vOp" hidden>
 <div class="calcard">
 <div class="weekbar">
  <button class="b3d" id="prevWeek" aria-label="Önceki hafta"><span>‹</span></button>
  <div class="lbl"><span id="weekTitle"></span><small id="weekRange"></small></div>
  <button class="b3d" id="nextWeek" aria-label="Sonraki hafta"><span>›</span></button>
 </div>
 <div class="days" id="days"></div>
 </div>
 <div class="mid" id="mid"></div>
 <div class="entries" id="entries"></div>
</section>

<!-- SAATLER -->
<section class="view" id="vStats" hidden>
 <div class="sathead">
  <div class="sat">
   <div><small>Sıradaki gün: <span id="satDay"></span></small><small class="lbl2">Forklift operatörü</small><b id="satWho"></b></div>
   <svg viewBox="0 0 64 64" fill="none" aria-hidden="true"><rect x="9" y="6" width="4.5" height="48" rx="2.2" fill="#0a2a6b"/><rect x="2" y="49" width="16" height="3.6" rx="1.8" fill="#0a2a6b"/><rect x="3.5" y="35" width="12" height="13" rx="2.5" fill="#0a2a6b" opacity=".55"/><rect x="13" y="40" width="7" height="9" rx="2" fill="#0a2a6b"/><path d="M19 37h25c3.2 0 5.4 2 6.4 5l2 9H19z" fill="#0a2a6b"/><path d="M25 37V16h17l5.5 10" stroke="#0a2a6b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="34" cy="24" r="3.6" fill="#0a2a6b"/><rect x="30" y="28" width="8" height="9" rx="3" fill="#0a2a6b"/><circle cx="26" cy="53" r="7" fill="#0a2a6b" stroke="#ffd100" stroke-width="1.5"/><circle cx="47" cy="53" r="6" fill="#0a2a6b" stroke="#ffd100" stroke-width="1.5"/><circle cx="26" cy="53" r="2.4" fill="#ffd100"/><circle cx="47" cy="53" r="2" fill="#ffd100"/></svg>
  </div>
  <button class="b3d" id="closeBtn2" aria-label="Kapat"><span>✕</span></button>
 </div>
 <div class="statcard">
  <div class="seg" id="seg" data-tab="week">
   <button id="tabWeek"><span>Hafta</span></button>
   <button id="tabTotal"><span>Toplam</span></button>
  </div>
  <div class="rows" id="rows"></div>
 </div>
</section>
</div>

<div class="modal" id="wkModal" hidden>
 <div class="sheet">
  <div class="dhead"><h3>Hafta seç</h3><button class="b3d dx" id="wkClose" aria-label="Kapat"><span>✕</span></button></div>
  <div class="wklist" id="wkList"></div>
 </div>
</div>
<div class="modal" id="detModal" hidden>
 <div class="sheet">
  <div class="dhead"><h3 id="detName"></h3><button class="b3d dx" id="detClose" aria-label="Kapat"><span>✕</span></button></div>
  <div class="dweek">
   <button class="b3d" id="dPrev" aria-label="Önceki hafta"><span>‹</span></button>
   <div id="dLbl"></div>
   <button class="b3d" id="dNext" aria-label="Sonraki hafta"><span>›</span></button>
  </div>
  <div id="dRows"></div>
  <div class="dfoot" id="dFoot"></div>
 </div>
</div>
<div class="modal" id="cfModal" hidden>
 <div class="sheet cf" role="alertdialog" aria-modal="true">
  <div class="ic"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></div>
  <h3 id="cfTitle">Silinsin mi?</h3>
  <p id="cfText">Bu kayıt kalıcı olarak silinecek.</p>
  <div class="btns"><button class="b3d" id="cfNo"><span>Vazgeç</span></button><button class="b3d r" id="cfYes"><span>Sil</span></button></div>
 </div>
</div>
<div id="tbg"></div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ============ Ayarlar ============ */
const NAMES=['Erhan','Erol','Gökhan','Sıtkı','Yasin'];
const DAY_OWNER=['Erhan','Erol','Gökhan','Sıtkı','Yasin'];
const DAY_SHORT=['Pzt','Sal','Çar','Per','Cum','Cmt'];

/* ============ Veri katmanı (Firestore, anlık senkron) ============
   Firebase konsolundan aldığın config'i aşağıya yapıştır. */
const FIREBASE_CONFIG={
  apiKey:"AIzaSyDeO_tGO0XyJqaQjrPUQ5cn9ivxd1fG6jE",
  authDomain:"forklifttakip-942e2.firebaseapp.com",
  projectId:"forklifttakip-942e2",
  storageBucket:"forklifttakip-942e2.firebasestorage.app",
  messagingSenderId:"46074928045",
  appId:"1:46074928045:web:a99b001cbf87dfa1ea9f24"
};
const USE_FB=FIREBASE_CONFIG.apiKey!=="BURAYA"&&typeof firebase!=="undefined";
const KEY='forklift-saatler-v2';
let onData=()=>{};
const store=USE_FB?(()=>{
 firebase.initializeApp(FIREBASE_CONFIG);
 const col=firebase.firestore().collection('saatler');
 let cache=[],ready;
 const first=new Promise(r=>ready=r);
 col.onSnapshot(snap=>{
  cache=snap.docs.map(d=>({id:d.id,...d.data()}));
  ready();onData(cache);
 },err=>{console.error(err);ready();toast('Bağlantı hatası',true)});
 return{
  async load(){await first;return cache},
  async add(rec){await col.doc(rec.id).set(rec)},
  async update(id,hours){await col.doc(id).update({hours})},
  async remove(id){await col.doc(id).delete()}
 };
})():{
 async load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return []}},
 async add(rec){const all=(await this.load()).filter(x=>x.id!==rec.id);all.push(rec);localStorage.setItem(KEY,JSON.stringify(all))},
 async update(id,hours){const all=await this.load();const r=all.find(x=>x.id===id);if(r)r.hours=hours;localStorage.setItem(KEY,JSON.stringify(all))},
 async remove(id){const all=(await this.load()).filter(r=>r.id!==id);localStorage.setItem(KEY,JSON.stringify(all))}
};

/* ============ Yardımcılar ============ */
const $=id=>document.getElementById(id);
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parse=s=>new Date(s+'T12:00:00');
const mondayOf=d=>{const x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-((x.getDay()||7)-1));return x};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const fmtShort=s=>parse(s).toLocaleDateString('tr-TR',{day:'numeric',month:'short'});
const sum=l=>l.reduce((s,r)=>s+Number(r.hours),0);
const todayISO=()=>iso(new Date());
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y0)/864e5+1)/7)}
const DAY_LONG=['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
function askConfirm(title,text,yes){
 return new Promise(res=>{
  $('cfTitle').textContent=title;$('cfText').textContent=text;$('cfYes').firstElementChild.textContent=yes||'Sil';
  const m=$('cfModal');m.hidden=false;
  const done=v=>{m.hidden=true;$('cfYes').onclick=$('cfNo').onclick=m.onclick=null;res(v)};
  $('cfYes').onclick=()=>done(true);$('cfNo').onclick=()=>done(false);
  m.onclick=e=>{if(e.target===m)done(false)};
 });
}
let AC=null;
function tink(err,kind){
 try{
  AC=AC||new(window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended')AC.resume();
  const t=AC.currentTime,tone=(f,v,d,type)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)};
  const sw=(f1,f2,v,d)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)};
  if(kind==='del'){sw(700,140,.3,.28);sw(350,70,.2,.28)}
  else if(err){tone(220,.25,.25,'triangle')}
  else{tone(1760,.3,.45);tone(2637,.14,.3);tone(3520,.06,.2)}
 }catch(e){}
}
const CHECK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',CROSS='<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
function toast(msg,err,kind){const t=$('toast');t.innerHTML=(err?CROSS:CHECK)+'<span></span>';t.lastChild.textContent=msg;t.classList.toggle('err',!!err);t.classList.add('show');$('tbg').classList.add('show');tink(err,kind);clearTimeout(toast.t);toast.t=setTimeout(()=>{t.classList.remove('show');$('tbg').classList.remove('show')},1400)}

/* ============ Durum ============ */
let records=[],user=null,weekOffset=0,selDate=null,picked=null,pickedKey=null,editingId=null,tab='week',selWeek=null;
async function refresh(){records=await store.load()}
function show(v){
 ['vHome','vOp','vStats'].forEach(x=>$(x).hidden=x!==v);
 $('closeBtn').hidden=v==='vHome';
 document.querySelector('header').classList.toggle('long',v==='vStats');
 document.querySelector('header').style.display=(v==='vStats'||v==='vHome')?'none':'';
 if(v!=='vOp')$('ttl').textContent='FORKLIFT ÇALIŞMA SAATİ';
}

/* ============ Cumartesi hesabı ============ */
function isoYearNow(){const t=new Date();t.setDate(t.getDate()+4-(t.getDay()||7));return t.getFullYear()}
function weekMonday(w){const j=new Date(isoYearNow(),0,4);return addDays(j,-((j.getDay()+6)%7)+(w-1)*7)}
function weekSums(w){
 const m=w?weekMonday(w):mondayOf(new Date());
 const s=iso(m),e=iso(addDays(m,6));
 const wk=records.filter(r=>r.date>=s&&r.date<e);
 return NAMES.map(n=>({name:n,hours:sum(wk.filter(r=>r.person===n))}));
}

function satISO(){return iso(addDays(mondayOf(new Date()),5))}
function satPerson(){
 const sd=satISO(),base=records.filter(r=>r.date<sd);
 const m0=iso(mondayOf(new Date())),wkR=records.filter(r=>r.date>=m0&&r.date<sd);
 const tot=NAMES.map(n=>({name:n,hours:sum(base.filter(r=>r.person===n)),wk:sum(wkR.filter(r=>r.person===n))}));
 if(records.length===0||tot.every(x=>x.hours===0))return null;
 const tmin=Math.min(...tot.map(x=>x.hours));
 let c=tot.filter(x=>x.hours===tmin);
 const wmin=Math.min(...c.map(x=>x.wk));c=c.filter(x=>x.wk===wmin);
 return c[isoWeek(new Date())%c.length].name;
}
const DAY_FULL=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
function nextDuty(){
 let n=(new Date().getDay()+1)%7;if(n===0)n=1; // pazar tatil → pazartesi
 return{day:DAY_FULL[n],who:n===6?satPerson():NAMES[n-1]};
}
function todayOwner(){const d=new Date().getDay();return d===0?null:d===6?satPerson():NAMES[d-1]}
const FORK='<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M26 14h12l6 14v10H26z"/><rect x="20" y="10" width="3" height="42" rx="1.5"/><rect x="6" y="48" width="22" height="3.5" rx="1.7"/><path d="M26 38h24a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H26z"/><circle cx="32" cy="50" r="6"/><circle cx="48" cy="50" r="6"/><circle cx="32" cy="50" r="2.2" fill="#0a2a6b"/><circle cx="48" cy="50" r="2.2" fill="#0a2a6b"/></svg>';

/* ============ Ana sayfa ============ */
function renderHome(){
 const own=todayOwner();
 $('names').innerHTML=NAMES.map(n=>`<button class="b3d ${n===own?'g':''}" data-name="${n}"><span>${FORK}${n}</span></button>`).join('');
}
$('names').addEventListener('click',async e=>{
 const b=e.target.closest('[data-name]');if(!b)return;
 user=b.dataset.name;weekOffset=0;picked=null;pickedKey=null;editingId=null;
 await refresh();selDate=defaultDay();renderOp();show('vOp');
});
$('goStats').addEventListener('click',async()=>{await refresh();tab='week';selWeek=null;renderStats();show('vStats')});
$('closeBtn').addEventListener('click',async()=>{user=null;pickedKey=null;await refresh();renderHome();show('vHome')});

/* ============ Operatör ============ */
function weekDates(){const m=addDays(mondayOf(new Date()),weekOffset*7);return[0,1,2,3,4,5].map(i=>iso(addDays(m,i)))}
function eligible(date){return weekDates().includes(date)&&date<=todayISO()}
function defaultDay(){const ds=weekDates();for(let i=5;i>=0;i--)if(eligible(ds[i]))return ds[i];return null}

function renderOp(){
 $('ttl').textContent=String(user).toLocaleUpperCase('tr-TR');
 const ds=weekDates(),mine=records.filter(r=>r.person===user);
 $('weekTitle').textContent=weekOffset===0?'Bu hafta':weekOffset===-1?'Geçen hafta':`${-weekOffset} hafta önce`;
 $('weekRange').textContent=`${fmtShort(ds[0])} – ${fmtShort(ds[5])}`;
 $('nextWeek').disabled=weekOffset>=0;
 $('days').innerHTML=ds.map((d,i)=>{
  const fut=d>todayISO(),tot=sum(mine.filter(r=>r.date===d));
  const sel=d===selDate;
  const isT=i<5?DAY_OWNER[i]===user:(weekOffset===0&&satPerson()===user);
  return `<button class="b3d day ${isT?'g':sel?'y':''} ${isT&&sel?'sel':''}" data-day="${d}" ${fut?'disabled':''}><span style="display:flex;flex-direction:column;align-items:center"><i>${DAY_SHORT[i]}</i><b>${parse(d).getDate()}</b><em>${tot?tot+' sa':''}</em>${isT?'<u>Senin günün</u>':''}</span></button>`;
 }).join('');
 const ok=selDate&&eligible(selDate);
 const recs=ok?mine.filter(r=>r.date===selDate):[],existing=sum(recs);
 const key=user+'|'+selDate;
 if(pickedKey!==key){pickedKey=key;picked=existing||null}
 $('mid').innerHTML=ok
  ?`<div class="askcard"><div class="asktxt">FORKLİFT KULLANDIĞINIZ SAATİ GİRİN</div><div class="hours">${[1,2,3,4,5,6,7,8].map(h=>`<button class="b3d ${picked===h?'y':''}" data-h="${h}"><span>${h}</span></button>`).join('')}</div></div>`
  :`<div class="state">Bir gün seç</div>`;
}
$('prevWeek').addEventListener('click',()=>{weekOffset--;selDate=defaultDay();renderOp()});
$('nextWeek').addEventListener('click',()=>{if(weekOffset<0){weekOffset++;selDate=defaultDay();renderOp()}});
$('days').addEventListener('click',e=>{const b=e.target.closest('[data-day]');if(!b||b.disabled)return;selDate=b.dataset.day;renderOp()});
$('mid').addEventListener('click',async e=>{
 const b=e.target.closest('[data-h]');if(!b||!selDate)return;
 const h=Number(b.dataset.h),date=selDate,who=user;
 const removing=picked===h;
 picked=removing?null:h;renderOp();
 const recs=records.filter(r=>r.person===who&&r.date===date);
 try{
  if(removing){
   for(const x of recs)await store.remove(x.id);
   toast('Kaldırıldı',false,'del');
  }else if(recs.length){
   await store.update(recs[0].id,h);
   for(const x of recs.slice(1))await store.remove(x.id);
   toast(`${h} saat kaydedildi`);
  }else{
   await store.add({id:who+'_'+date,person:who,date:date,hours:h});
   toast(`${h} saat kaydedildi`);
  }
  await refresh();renderOp();
 }catch(err){pickedKey=null;toast('Kaydedilemedi',true);await refresh();renderOp()}
});

/* ============ Saatler ============ */
function renderStats(){
 const curW=isoWeek(new Date()),viewW=selWeek||curW,wk=weekSums(viewW===curW?null:viewW);
 const nd=nextDuty(),sp=nd.who,nobody=!sp,low=[sp];
 $('satDay').textContent=nd.day;
 $('satWho').textContent=nobody?'—':sp;
 $('tabWeek').firstElementChild.innerHTML=`${viewW}. Hafta<span class="car">▾</span>`;
 $('tabWeek').classList.toggle('on',tab==='week');$('tabTotal').classList.toggle('on',tab==='total');$('seg').dataset.tab=tab;
 const rows=(tab==='week'?wk:NAMES.map(n=>({name:n,hours:sum(records.filter(r=>r.person===n))}))).slice().sort((a,b)=>b.hours-a.hours);
 const max=Math.max(1,...rows.map(r=>r.hours));
 $('rows').innerHTML=rows.map(r=>{
  const isLow=!nobody&&viewW===curW&&low.includes(r.name);
  const yel=tab==='total'||isLow;
  return `<div class="row ${isLow?'low':''}" data-name="${r.name}"><div class="nm">${r.name}</div><div class="track"><div class="fill ${yel?'y':''}" style="width:${r.hours?Math.max(6,r.hours/max*100):0}%"></div></div><div class="hr">${r.hours} sa</div></div>`;
 }).join('');
}
/* ---- Kişi detayı ---- */
let detName=null,detOff=0;
function renderDet(){
 const m=addDays(mondayOf(new Date()),detOff*7);
 const ds=[0,1,2,3,4,5].map(i=>iso(addDays(m,i))),mine=records.filter(r=>r.person===detName);
 $('detName').textContent=detName;
 $('dLbl').innerHTML=`<b>${isoWeek(m)}. Hafta</b><small>${fmtShort(ds[0])} – ${fmtShort(ds[5])}</small>`;
 $('dNext').disabled=detOff>=0;
 let wt=0;
 $('dRows').innerHTML=ds.map((d,i)=>{const h=sum(mine.filter(r=>r.date===d));wt+=h;return `<div class="drow ${h?'':'zero'}"><span>${DAY_LONG[i]}<small>${fmtShort(d)}</small></span><b>${h?h+' sa':'—'}</b></div>`}).join('');
 $('dFoot').innerHTML=`<span>Hafta<b>${wt} sa</b></span><span>Toplam<b>${sum(mine)} sa</b></span>`;
}
$('rows').addEventListener('click',e=>{const r=e.target.closest('[data-name]');if(!r)return;detName=r.dataset.name;detOff=0;renderDet();$('detModal').hidden=false});
$('dPrev').addEventListener('click',()=>{detOff--;renderDet()});
$('dNext').addEventListener('click',()=>{if(detOff<0){detOff++;renderDet()}});
$('detClose').addEventListener('click',()=>$('detModal').hidden=true);
$('closeBtn2').addEventListener('click',()=>$('closeBtn').click());
$('tabWeek').addEventListener('click',()=>{if(tab==='week'){openWeekPicker();return}tab='week';renderStats()});
function openWeekPicker(){
 const curW=isoWeek(new Date()),viewW=selWeek||curW;
 $('wkList').innerHTML=Array.from({length:52},(_,i)=>{
  const w=i+1,m=weekMonday(w);
  return `<button class="wkit ${w===viewW?'sel':''} ${w===curW?'cur':''}" data-w="${w}"><span>${w}. Hafta</span><small>${fmtShort(iso(m))} – ${fmtShort(iso(addDays(m,5)))}</small></button>`;
 }).join('');
 $('wkModal').hidden=false;
 const el=$('wkList').querySelector('.sel');if(el)$('wkList').scrollTop=Math.max(0,el.offsetTop-$('wkList').offsetTop-80);
}
$('wkList').addEventListener('click',e=>{const b=e.target.closest('[data-w]');if(!b)return;selWeek=Number(b.dataset.w);$('wkModal').hidden=true;renderStats()});
$('wkClose').addEventListener('click',()=>$('wkModal').hidden=true);
$('wkModal').addEventListener('click',e=>{if(e.target===$('wkModal'))$('wkModal').hidden=true});
$('tabTotal').addEventListener('click',()=>{tab='total';renderStats()});

/* ============ Başlangıç ============ */
onData=d=>{
 records=d;
 if(!$('vHome').hidden)renderHome();
 if(!$('vOp').hidden&&user)renderOp();
 if(!$('vStats').hidden)renderStats();
 if(!$('detModal').hidden&&detName)renderDet();
};
(async()=>{await refresh();renderHome();show('vHome')})();
</script>
<script>if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
